[project]
name = "act-one"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pannakotta", email = "panissimo13@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
act-one = "act_one:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]